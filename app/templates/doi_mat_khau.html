{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<h1>Đổi mật khẩu</h1>
<form method="post" class="card">
  <label>Mật khẩu hiện tại <input type="password" name="cu" required></label>
  <label>Mật khẩu mới <input type="password" name="moi" minlength="8" required></label>
  <label>Nhập lại mật khẩu mới <input type="password" name="nhap_lai" minlength="8" required></label>
  <button>Đổi mật khẩu</button>
</form>
{% endblock %}
